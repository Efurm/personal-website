{% extends "base.html" %}

{% block content %}
    <h1>My To Do List</h1>
    <p>You have {{ ToDoList|length }} things on your to do list.</p>
    <ul>
    {% for task in ToDoList %}
        <li>
            {{ task.name }}
            {% if task.completed %}
                - Completed
            {% else %}
                - In Progress
            {% endif %}
        </li>
    {% endfor %}
    </ul>
{% endblock content %}
